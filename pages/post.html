<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<title>Create Post | Lumora</title>

<body>

<nav class="navbar">

<ul class="nav-links">

<main class="create-post-page">

<div class="create-post-card">

<h1>Create a New Post</h1>

<p>Share your thoughts with the Lumora community.</p>

<form id="postForm">

<textarea

id="postContent"

placeholder="What's on your mind?"

rows="8"

required>

</textarea>

<button

type="submit"

class="primary">

🚀 Publish Post

</button>

</form>

<p id="postStatus"></p>

</div>

</main>

<script type="module" src="../js/posts.js"></script>

</body>
