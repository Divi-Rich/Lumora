<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Create Post | Lumora</title>

<link rel="stylesheet" href="../style.css">

</head>

<body>

<header>

<nav class="navbar">

<h1 class="logo">🌟 Lumora</h1>

<ul class="nav-links">
<li><a href="../index.html">Home</a></li>
<li><a href="dashboard.html">Dashboard</a></li>
<li><a href="profile.html">Profile</a></li>
<li><a href="reels.html">Reels</a></li>
</ul>

</nav>

</header>

<section class="create-post-page">

<div class="post-box">

<h1>Create a New Post</h1>

<p>Share your thoughts, photos, videos and ideas with everyone.</p>

<form id="postForm">

<label>Post Title</label>

<input
type="text"
id="postTitle"
placeholder="Give your post a title..."
required>

<label>What's on your mind?</label>

<textarea
id="postContent"
rows="6"
placeholder="Write something amazing..."
required></textarea>

<label>Upload Image</label>

<input
type="file"
id="imageUpload"
accept="image/*">

<div id="imagePreview"></div>

<label>Upload Video</label>

<input
type="file"
id="videoUpload"
accept="video/*">

<div id="videoPreview"></div>

<label>Upload Music (Coming Soon)</label>

<input
type="file"
accept="audio/*"
disabled>

<div class="post-buttons">

<button type="reset" class="secondary">
Clear
</button>

<button type="submit" class="primary">
🚀 Publish Post
</button>

</div>

</form>

</div>

</section>

<footer>

<p>© 2026 Lumora</p>

<p>Discover • Learn • Connect • Grow</p>

</footer>

<script src="../script.js"></script>

</body>

</html>
