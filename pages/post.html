<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Create Post | Lumora</title>

<link rel="stylesheet" href="../style.css">

</head>

<body>

<header>

<nav class="navbar">

<div class="logo">
🌟 Lumora
</div>

<ul class="nav-links">

<li><a href="../index.html">Home</a></li>

<li><a href="dashboard.html">Dashboard</a></li>

<li><a href="feed.html">Feed</a></li>

<li><a href="profile.html">Profile</a></li>

<li>
<button onclick="window.location.href='login.html'" class="logout-btn">
Logout
</button>
</li>

</ul>

</nav>

</header>

<main class="page-container">

<div class="post-card glass-card">

<h1>Create a Post</h1>

<p>Share something amazing with the Lumora community.</p>

<form id="postForm">

<textarea
id="caption"
placeholder="What's on your mind today?"
rows="6"
required></textarea>

<input
type="file"
id="postImage"
accept="image/*">

<img
id="imagePreview"
style="display:none;width:100%;margin-top:15px;border-radius:15px;">

<button
type="submit"
class="primary">

🚀 Publish Post

</button>

</form>

<p id="status"></p>

</div>

</main>

<footer>

<p>© 2026 Lumora</p>

<p>Discover • Learn • Connect • Grow</p>

</footer>

<script type="module" src="../js/post.js"></script>

<script>

const imageInput = document.getElementById("postImage");
const preview = document.getElementById("imagePreview");

imageInput.addEventListener("change", () => {

    const file = imageInput.files[0];

    if(file){

        preview.src = URL.createObjectURL(file);

        preview.style.display = "block";

    }

});

</script>

</body>

</html>
