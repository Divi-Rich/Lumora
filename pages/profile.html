<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Profile | Lumora</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="../style.css">

</head>

<body>

<header class="topbar">

<div class="logo">

🌟 Lumora

</div>

<div class="top-icons">

<a href="notifications.html">🔔</a>

<a href="messages.html">💬</a>

</div>

</header>

<main class="dashboard">

<section class="glass-card profile-card">

<div class="profile-header">

<img
id="profilePhoto"
src="https://ui-avatars.com/api/?name=User&background=7c3aed&color=fff&size=200"
class="profile-image"
alt="Profile">

<h2 id="profileName">

Loading...

</h2>

<p id="profileEmail">

Loading...

</p>

<p class="profile-bio">

🚀 Discover • Learn • Connect • Grow

</p>

</div>

<div class="stats">

<div class="stat-card">

<h2 id="postCount">0</h2>

<p>Posts</p>

</div>

<div class="stat-card">

<h2>0</h2>

<p>Followers</p>

</div>

<div class="stat-card">

<h2>0</h2>

<p>Following</p>

</div>

</div>

<div class="quick-actions">

<button class="primary" id="editProfileBtn">

✏️ Edit Profile

</button>

<button class="secondary" id="logoutBtn">

🚪 Logout

</button>

</div>

</section>

<section class="feed-preview">

<h2>📸 My Posts</h2>

<div id="myPosts">

<div class="post-card">

<p>Loading your posts...</p>

</div>

</div>

</section>

</main>

<nav class="bottom-nav">

<a href="dashboard.html">🏠</a>

<a href="feed.html">📰</a>

<a href="post.html">➕</a>

<a href="messages.html">💬</a>

<a href="profile.html">👤</a>

</nav>

<script type="module" src="../js/profile.js"></script>

</body>

</html>
