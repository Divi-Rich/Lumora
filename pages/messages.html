<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Messages | Lumora</title>

<link rel="preconnect"
      href="https://fonts.googleapis.com">

<link rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet">

<link rel="stylesheet"
      href="../style.css">

</head>

<body>

<header class="topbar">

    <div class="logo">

        🌟 Lumora

    </div>

    <div class="top-icons">

        <a href="notifications.html">🔔</a>

        <a href="profile.html">👤</a>

    </div>

</header>


<main class="messages-page">

    <h1 class="feed-title">

        💬 Private Messages

    </h1>


    <div class="chat-container">


        <!-- =========================
             USERS / CONVERSATIONS
        ========================== -->

        <div class="chat-list">

            <input
                type="text"
                id="searchUser"
                placeholder="🔍 Search Lumorians...">


            <div id="usersList">

                <p>
                    Loading users...
                </p>

            </div>

        </div>



        <!-- =========================
             CHAT
        ========================== -->

        <div class="chat-box">


            <div class="chat-header">

                <div>

                    <h2 id="chatName">

                        Select a user

                    </h2>

                    <p id="chatStatus">

                        Choose someone to start chatting.

                    </p>

                </div>

            </div>



            <div
                class="chat-messages"
                id="chatMessages">

                <div class="message received">

                    👋 Select a Lumorian from the left
                    to start a private conversation.

                </div>

            </div>



            <div class="chat-input">

                <input
                    type="text"
                    id="messageInput"
                    placeholder="Select a user first..."
                    disabled>


                <button
                    id="sendBtn"
                    class="primary"
                    disabled>

                    📤 Send

                </button>

            </div>

        </div>

    </div>

</main>


<nav class="bottom-nav">

    <a href="dashboard.html">🏠</a>

    <a href="feed.html">📰</a>

    <a href="post.html">➕</a>

    <a href="messages.html">💬</a>

    <a href="profile.html">👤</a>

</nav>


<script
    type="module"
    src="../js/messages.js">
</script>

</body>

</html>
