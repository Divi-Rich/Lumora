<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Messages | Lumora</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="../style.css">

</head>

<body>

<header class="topbar">

<div class="logo">
    🌟 Lumora
</div>

<div class="top-icons">

<a href="dashboard.html">🏠</a>

<a href="notifications.html">🔔</a>

<a href="profile.html">👤</a>

</div>

</header>


<section class="messages-page">

<h1>💬 Messages</h1>


<div class="chat-container">


<!-- =========================
     CONVERSATION LIST
========================= -->

<div class="chat-list">

<input
    type="text"
    id="searchUser"
    placeholder="🔍 Search users..."
    autocomplete="off"
>


<div id="usersList">

<p style="opacity:.7;text-align:center;padding:20px;">
Loading users...
</p>

</div>

</div>



<!-- =========================
     CHAT AREA
========================= -->

<div class="chat-box">


<div class="chat-header">

<div>

<h2 id="chatName">
Select a user
</h2>

<p id="chatStatus">
Choose someone to start chatting
</p>

</div>

</div>



<div
    class="chat-messages"
    id="chatMessages"
>

<div style="text-align:center;opacity:.6;padding:30px;">

💬 Select a person to start a private conversation.

</div>

</div>



<div class="chat-input">

<input
    type="text"
    id="messageInput"
    placeholder="Type a message..."
    autocomplete="off"
    disabled
>

<button
    id="sendBtn"
    class="primary"
    disabled
>

📤 Send

</button>

</div>


</div>

</div>

</section>


<footer>

<p>© 2026 Lumora</p>

<p>Discover • Learn • Connect • Grow</p>

</footer>


<script
    type="module"
    src="../js/messages.js">
</script>

</body>

</html>
