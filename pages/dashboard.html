<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dashboard | Lumora</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="../style.css">

</head>

<body>

<header class="topbar">

<div class="logo">

🌟 Lumora

</div>

<div class="top-icons">

<a href="notifications.html">🔔</a>

<a href="profile.html">👤</a>

<button id="logoutBtn" class="logout-btn">

Logout

</button>

</div>

</header>

<main class="dashboard">

<div class="search-box">

<input
type="text"
placeholder="🔍 Search Lumora...">

</div>

<section class="welcome-card glass-card">

<h2 id="welcomeUser">

👋 Welcome Back!

</h2>

<p>

Discover • Learn • Connect • Grow

</p>

</section>

<section class="stories">

<h3>📸 Stories</h3>

<div class="story-container">

<div class="story">➕</div>

<div class="story">A</div>

<div class="story">B</div>

<div class="story">C</div>

<div class="story">D</div>

<div class="story">E</div>

</div>

</section>

<section class="quick-actions">

<a href="post.html">

<button class="primary">

➕ Create Post

</button>

</a>

<a href="feed.html">

<button class="secondary">

📰 Feed

</button>

</a>

</section>

<section class="stats">

<div class="glass-card stat-card">

<h2 id="postsCount">0</h2>

<p>Posts</p>

</div>

<div class="glass-card stat-card">

<h2 id="followersCount">0</h2>

<p>Followers</p>

</div>

<div class="glass-card stat-card">

<h2 id="followingCount">0</h2>

<p>Following</p>

</div>

</section>

<section class="feed-preview">

<h2>🔥 Latest Posts</h2>

<div id="postsContainer">

<p>Loading posts...</p>

</div>

</section>

</main>

<nav class="bottom-nav">

<a href="dashboard.html">🏠</a>

<a href="feed.html">📰</a>

<a href="post.html">➕</a>

<a href="messages.html">💬</a>

<a href="profile.html">👤</a>

</nav>

<script type="module" src="../js/dashboard.js"></script>

</body>

</html>
