<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Create Account | Lumora</title>

<link rel="stylesheet" href="../style.css">

</head>

<body>

<div class="login-container">

<div class="login-box">

<h1>🌟 Lumora</h1>

<h2>Create Account</h2>

<p>Join the Lumora community.</p>

<form id="signupForm">

<input
type="text"
id="fullName"
placeholder="Full Name"
required>

<input
type="text"
id="username"
placeholder="Username"
required>

<input
type="email"
id="signupEmail"
placeholder="Email Address"
required>

<div class="password-box">

<input
type="password"
id="signupPassword"
placeholder="Password"
required>

<span id="togglePassword">👁️</span>

</div>

<button type="submit">

Create Account

</button>

</form>

<p class="bottom-text">

Already have an account?

<a href="login.html">

Login

</a>

</p>

</div>

</div>

<script type="module" src="../js/signup.js"></script>

</body>

</html>
