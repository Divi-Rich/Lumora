<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Stories | Lumora</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="../style.css">

</head>

<body>

<header class="topbar">

<div class="logo">

🌟 Lumora Stories

</div>

<div class="top-icons">

<a href="notifications.html">🔔</a>

<a href="messages.html">💬</a>

<a href="profile.html">👤</a>

</div>

</header>

<main class="dashboard">

<h2 class="feed-title">

📸 Stories

</h2>

<section class="stories">

<div class="story-container">

<div class="story">➕</div>

<div class="story">👨🏽</div>

<div class="story">👩🏾</div>

<div class="story">🤖</div>

<div class="story">🎵</div>

<div class="story">🌍</div>

<div class="story">📚</div>

</div>

</section>

<div class="glass-card" style="padding:20px;margin-top:25px;">

<h3>Create Story</h3>

<input
type="file"
id="storyImage"
accept="image/*,video/*">

<button
id="uploadStoryBtn"
class="primary">

📤 Upload Story

</button>

<p id="storyStatus"></p>

</div>

<section class="feed-preview">

<h2>Recent Stories</h2>

<div id="storiesContainer">

<div class="post-card">

<p>No stories yet.</p>

</div>

</div>

</section>

</main>

<nav class="bottom-nav">

<a href="dashboard.html">🏠</a>

<a href="feed.html">📰</a>

<a href="post.html">➕</a>

<a href="messages.html">💬</a>

<a href="profile.html">👤</a>

</nav>

<script type="module" src="../js/stories.js"></script>

</body>

</html>
